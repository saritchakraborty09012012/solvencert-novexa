<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t1 d1">
  <title id="t1">Wickets taken at home vs. overseas</title>
  <desc id="d1">Stacked horizontal bar chart on a 0 to 300 scale. Home: Test 62, ODI 100, T20 32, total 194. Overseas: Test 172, ODI 49, T20 71, total 292.</desc>

  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <text x="18" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2937">Wickets taken at home vs. overseas</text>

  <!-- legend -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1f2937">
    <rect x="600" y="17" width="16" height="16" rx="2" fill="#1d4ed8"/>
    <text x="622" y="31">Test</text>
    <rect x="678" y="17" width="16" height="16" rx="2" fill="#b45309"/>
    <text x="700" y="31">ODI</text>
    <rect x="752" y="17" width="16" height="16" rx="2" fill="#15803d"/>
    <text x="774" y="31">T20</text>
  </g>

  <!-- gridlines + x axis labels (0 to 300, every 50) -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="90" y1="62" x2="90" y2="252" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="216.67" y1="62" x2="216.67" y2="252"/>
    <line x1="343.33" y1="62" x2="343.33" y2="252"/>
    <line x1="470" y1="62" x2="470" y2="252"/>
    <line x1="596.67" y1="62" x2="596.67" y2="252"/>
    <line x1="723.33" y1="62" x2="723.33" y2="252"/>
    <line x1="850" y1="62" x2="850" y2="252"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="90" y="272">0</text>
    <text x="216.67" y="272">50</text>
    <text x="343.33" y="272">100</text>
    <text x="470" y="272">150</text>
    <text x="596.67" y="272">200</text>
    <text x="723.33" y="272">250</text>
    <text x="850" y="272">300</text>
  </g>

  <!-- category labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1f2937" text-anchor="end">
    <text x="78" y="123">Home</text>
    <text x="78" y="208">Overseas</text>
  </g>

  <!-- Home: 62 + 100 + 32 = 194 -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="90" y="92" width="157.07" height="50" fill="#1d4ed8"/>
    <rect x="247.07" y="92" width="253.33" height="50" fill="#b45309"/>
    <rect x="500.40" y="92" width="81.07" height="50" fill="#15803d"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="168.5" y="123">Test 62</text>
    <text x="373.7" y="123">ODI 100</text>
    <text x="540.9" y="123">T20 32</text>
  </g>
  <text x="591.5" y="123" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#111827">194</text>

  <!-- Overseas: 172 + 49 + 71 = 292 -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="90" y="177" width="435.73" height="50" fill="#1d4ed8"/>
    <rect x="525.73" y="177" width="124.13" height="50" fill="#b45309"/>
    <rect x="649.87" y="177" width="179.87" height="50" fill="#15803d"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="307.9" y="208">Test 172</text>
    <text x="587.8" y="208">ODI 49</text>
    <text x="739.8" y="208">T20 71</text>
  </g>
  <text x="839.7" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#111827">292</text>
</svg>
