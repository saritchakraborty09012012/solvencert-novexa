<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t2 d2">
  <title id="t2">Wickets taken in different formats</title>
  <desc id="d2">Stacked horizontal bar chart on a 0 to 300 scale. Test: Home 62, Overseas 172, total 234. ODI: Home 100, Overseas 49, total 149. T20: Home 32, Overseas 71, total 103.</desc>

  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>

  <text x="18" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2937">Wickets taken in different formats</text>

  <!-- legend -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1f2937">
    <rect x="660" y="17" width="16" height="16" rx="2" fill="#1d4ed8"/>
    <text x="682" y="31">Home</text>
    <rect x="750" y="17" width="16" height="16" rx="2" fill="#b91c1c"/>
    <text x="772" y="31">Overseas</text>
  </g>

  <!-- gridlines + x axis labels (0 to 300, every 50) -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="90" y1="62" x2="90" y2="262" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="216.67" y1="62" x2="216.67" y2="262"/>
    <line x1="343.33" y1="62" x2="343.33" y2="262"/>
    <line x1="470" y1="62" x2="470" y2="262"/>
    <line x1="596.67" y1="62" x2="596.67" y2="262"/>
    <line x1="723.33" y1="62" x2="723.33" y2="262"/>
    <line x1="850" y1="62" x2="850" y2="262"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="90" y="284">0</text>
    <text x="216.67" y="284">50</text>
    <text x="343.33" y="284">100</text>
    <text x="470" y="284">150</text>
    <text x="596.67" y="284">200</text>
    <text x="723.33" y="284">250</text>
    <text x="850" y="284">300</text>
  </g>

  <!-- category labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1f2937" text-anchor="end">
    <text x="78" y="104">Test</text>
    <text x="78" y="174">ODI</text>
    <text x="78" y="244">T20</text>
  </g>

  <!-- Test: 62 + 172 = 234 -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="90" y="75" width="157.07" height="46" fill="#1d4ed8"/>
    <rect x="247.07" y="75" width="435.73" height="46" fill="#b91c1c"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="168.5" y="104">Home 62</text>
    <text x="464.9" y="104">Overseas 172</text>
  </g>
  <text x="692.8" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#111827">234</text>

  <!-- ODI: 100 + 49 = 149 -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="90" y="145" width="253.33" height="46" fill="#1d4ed8"/>
    <rect x="343.33" y="145" width="124.13" height="46" fill="#b91c1c"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="216.7" y="174">Home 100</text>
    <text x="405.4" y="174">Overseas 49</text>
  </g>
  <text x="477.5" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#111827">149</text>

  <!-- T20: 32 + 71 = 103 -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="90" y="215" width="81.07" height="46" fill="#1d4ed8"/>
    <rect x="171.07" y="215" width="179.87" height="46" fill="#b91c1c"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="130.6" y="244">Home 32</text>
    <text x="261.0" y="244">Overseas 71</text>
  </g>
  <text x="360.9" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#111827">103</text>
</svg>
